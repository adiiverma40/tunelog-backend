name: Publish to GitHub Container Registry

on:
  schedule:
    - cron: "0 20 1 * *"
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      PUBLISHED: ${{ steps.release.outputs.new_release_published }}
      VERSION: ${{ steps.release.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}
          
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          
      - name: Configure Semantic Release
        run: |
          cat <<EOF > .releaserc.json
          {
            "branches": ["main"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              "@semantic-release/github"
            ]
          }
          EOF
          
      - name: Release
        id: release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

  publish-docker:
    needs: [release]
    # Only trigger Docker build if a new version was actually published
    if: ${{ needs.release.outputs.PUBLISHED == 'true' }}
    uses: ./.github/workflows/docker-publish.yaml
    with:
      app_version: ${{ needs.release.outputs.VERSION }}
    secrets: inherit
    permissions:
      contents: write
      packages: write
      id-token: write

  post-release:
    runs-on: ubuntu-latest
    needs: [release]
    # Only run post-release if a new version was actually published
    if: ${{ needs.release.outputs.PUBLISHED == 'true' }}
    steps:
      - name: Print release result
        run: |
          VERSION='${{ needs.release.outputs.VERSION }}'
          echo "- RESULT: SUCCESS"
          echo "- VERSION: ${VERSION}"